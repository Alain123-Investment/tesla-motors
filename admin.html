<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TESLA MOTORS - Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #080d1a; color: #f8fafc; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; background: #0b1329; min-height: 100vh; position: relative; padding-bottom: 85px; }

    /* Top Navigation Header */
    .top-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 16px; background: #0b1329; border-bottom: 1px solid #1e293b; }
    .brand-logo { font-size: 18px; font-weight: 900; color: #3b82f6; display: flex; align-items: center; gap: 6px; }
    .btn-switch { background: #ef4444; color: white; border: none; padding: 7px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    /* Main Content Wrapper */
    .content-area { padding: 16px; }

    /* Stats / Balance Card */
    .stat-card { background: #111c38; border-radius: 16px; padding: 20px; border: 1px solid #1e2d52; margin-bottom: 20px; }
    .stat-title { font-size: 11px; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 28px; font-weight: 900; color: #2563eb; margin-top: 6px; }

    /* Section Title */
    .section-title { font-size: 14px; font-weight: 800; color: #ffffff; margin-bottom: 12px; }

    /* Grid Menu Actions (Bitsa, Bikuza, Itsinda, Ubufasha) */
    .admin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
    .admin-card { background: #111c38; padding: 16px 8px; border-radius: 14px; text-align: center; border: 1px solid #1e2d52; cursor: pointer; transition: 0.2s; }
    .admin-card:active { transform: scale(0.96); background: #18284e; }
    .admin-icon { font-size: 22px; margin-bottom: 6px; display: block; }
    .admin-label { font-size: 11px; font-weight: 700; color: #cbd5e1; }

    /* Tables & Request List Cards */
    .req-card { background: #111c38; border-radius: 14px; padding: 14px; border: 1px solid #1e2d52; margin-bottom: 12px; }
    .req-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .req-user { font-size: 13px; font-weight: 800; color: #white; }
    .req-amount { font-size: 14px; font-weight: 900; color: #10b981; }
    .req-type { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
    .type-deposit { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .type-withdraw { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

    .req-info { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }

    .req-actions { display: flex; gap: 8px; }
    .btn-approve { flex: 1; background: #10b981; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; }
    .btn-reject { flex: 1; background: #ef4444; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; }

    /* Bottom Navigation Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #080d1a; border-top: 1px solid #1e293b; display: flex; justify-content: space-around; padding: 10px 0; z-index: 90; }
    .nav-item { text-align: center; color: #64748b; font-size: 11px; font-weight: 700; cursor: pointer; flex: 1; }
    .nav-item.active { color: #3b82f6; }
    .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- TOP HEADER -->
  <div class="top-header">
    <div class="brand-logo">
      ⚡ TESLA MOTORS
    </div>
    <button class="btn-switch" onclick="switchMode()">
      ⚙️ Switch Mode (User/Admin)
    </button>
  </div>

  <div class="content-area">

    <!-- ADMIN USER BALANCE STAT CARD -->
    <div class="stat-card">
      <div class="stat-title">AYO UFITEHO (USER BALANCE)</div>
      <div class="stat-value" id="totalBalanceDisp">51,000 RWF</div>
    </div>

    <!-- MAIN ACTION GRID MENU -->
    <div class="section-title">Ibikorwa</div>
    
    <div class="admin-grid">
      <div class="admin-card" onclick="filterRequests('deposit')">
        <span class="admin-icon">💵</span>
        <span class="admin-label">Bitsa</span>
      </div>
      <div class="admin-card" onclick="filterRequests('withdraw')">
        <span class="admin-icon">📲</span>
        <span class="admin-label">Bikuza</span>
      </div>
      <div class="admin-card" onclick="showTeamList()">
        <span class="admin-icon">👥</span>
        <span class="admin-label">Itsinda</span>
      </div>
      <div class="admin-card" onclick="showSupportSection()">
        <span class="admin-icon">🎧</span>
        <span class="admin-label">Ubufasha</span>
      </div>
    </div>

    <!-- MANAGEMENT LIST SECTION -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div class="section-title" style="margin-bottom:0;" id="listSectionTitle">Ubusabe bw'Abakiriya (Pending)</div>
      <span style="font-size: 11px; color: #3b82f6; cursor: pointer; font-weight: 700;" onclick="loadPendingRequests()">🔄 Refresh</span>
    </div>

    <div id="requestsContainer">
      <!-- Dynamic Request Items loaded via JS -->
    </div>

  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="goToHome()">
      <span class="nav-icon">🏠</span>
      Ahabanza
    </div>
    <div class="nav-item active">
      <span class="nav-icon">⚙️</span>
      Admin Panel
    </div>
  </div>

</div>

<script>
  // Sample Pending Requests Data
  let pendingRequests = [
    { id: 1, type: 'deposit', user: 'Bruno Alain', phone: '0789681391', amount: 50000, date: '10 mins ago', code: 'TXN-99812' },
    { id: 2, type: 'withdraw', user: 'Eric Manzi', phone: '0788123456', amount: 12000, date: '25 mins ago', code: 'MOMO-7712' },
    { id: 3, type: 'deposit', user: 'Clarisse U.', phone: '0731112233', amount: 100000, date: '1 hour ago', code: 'TXN-44102' }
  ];

  window.onload = function() {
    renderRequests(pendingRequests);
  };

  function renderRequests(data) {
    const container = document.getElementById('requestsContainer');
    container.innerHTML = '';

    if (data.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b; font-size:12px;">Nta busabe buhari gukorwaho kuri ubu.</div>';
      return;
    }

    data.forEach(req => {
      const isDep = req.type === 'deposit';
      container.innerHTML += `
        <div class="req-card" id="req-${req.id}">
          <div class="req-header">
            <span class="req-user">${req.user} (${req.phone})</span>
            <span class="req-type ${isDep ? 'type-deposit' : 'type-withdraw'}">${req.type}</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span class="req-amount">${req.amount.toLocaleString()} RWF</span>
            <span style="font-size:10px; color:#64748b;">${req.date}</span>
          </div>
          <div class="req-info">Code/Ref: <b>${req.code}</b></div>
          <div class="req-actions">
            <button class="btn-approve" onclick="approveReq(${req.id})">✓ Emeza</button>
            <button class="btn-reject" onclick="rejectReq(${req.id})">✕ Anga</button>
          </div>
        </div>
      `;
    });
  }

  function approveReq(id) {
    if (confirm("Wemeje ubu busabe bw'amafaranga?")) {
      pendingRequests = pendingRequests.filter(r => r.id !== id);
      renderRequests(pendingRequests);
      alert("Ubusabe bwemejwe neza!");
    }
  }

  function rejectReq(id) {
    if (confirm("Wangeze ubu busabe bw'amafaranga?")) {
      pendingRequests = pendingRequests.filter(r => r.id !== id);
      renderRequests(pendingRequests);
      alert("Ubusabe bwanzwe!");
    }
  }

  function filterRequests(type) {
    document.getElementById('listSectionTitle').innerText = "Ubusabe bwa " + type.toUpperCase();
    const filtered = pendingRequests.filter(r => r.type === type);
    renderRequests(filtered);
  }

  function loadPendingRequests() {
    document.getElementById('listSectionTitle').innerText = "Ubusabe bw'Abakiriya (Pending)";
    renderRequests(pendingRequests);
  }

  function showTeamList() {
    document.getElementById('listSectionTitle').innerText = "Itsinda / Referral Level";
    const container = document.getElementById('requestsContainer');
    container.innerHTML = `
      <div class="req-card">
        <div style="font-size:13px; font-weight:800; color:white; margin-bottom:6px;">Level 1 Referrals (35% Bonus)</div>
        <div style="font-size:12px; color:#94a3b8;">Abakiriya bose hamwe: <b>14</b></div>
      </div>
      <div class="req-card">
        <div style="font-size:13px; font-weight:800; color:white; margin-bottom:6px;">Total Team Earnings</div>
        <div style="font-size:14px; font-weight:900; color:#10b981;">185,000 RWF</div>
      </div>
    `;
  }

  function showSupportSection() {
    document.getElementById('listSectionTitle').innerText = "Ubufasha & Setting";
    const container = document.getElementById('requestsContainer');
    container.innerHTML = `
      <div class="req-card">
        <div style="font-size:13px; font-weight:800; color:white; margin-bottom:6px;">WhatsApp Support Line</div>
        <div style="font-size:12px; color:#3b82f6;">+250 789 681 391</div>
      </div>
    `;
  }

  function switchMode() {
    window.location.href = "index.html"; // Kwerekeza kuri User Dashboard
  }

  function goToHome() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
